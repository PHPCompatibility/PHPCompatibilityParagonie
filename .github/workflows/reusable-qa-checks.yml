name: QA checks

on:
  workflow_call:

# Permissions should be configured at the job level.
permissions: {}

jobs:
  pinact:
    permissions:
      contents: read # To clone the repo.

    name: 'Run Pinact'
    uses: PHPCSStandards/.github/.github/workflows/reusable-pinact.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1

  yamllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Lint Yaml'
    uses: PHPCSStandards/.github/.github/workflows/reusable-yamllint.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1
    with:
      strict: true

  xmllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Check XML'
    runs-on: ubuntu-latest

    env:
      XMLLINT_INDENT: '    '

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 'latest'
          coverage: none

      # Install dependencies to make sure the PHPCS XSD file is available.
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Validate Ruleset XML file against schema
        uses: phpcsstandards/xmllint-validate@5189514594c8d5f4cf21b7e5af50f54d697973d7 # v2.0.0
        with:
          pattern: "./*/ruleset.xml"
          xsd-file: "vendor/squizlabs/php_codesniffer/phpcs.xsd"

      # Check the code-style consistency of the xml files.
      # Note: this needs xmllint, but that will be installed via the phpcsstandards/xmllint-validate action runner.
      - name: Check code style
        run: |
          diff -B ./PHPCompatibilityParagonieRandomCompat/ruleset.xml <(xmllint --format "./PHPCompatibilityParagonieRandomCompat/ruleset.xml")
          diff -B ./PHPCompatibilityParagonieSodiumCompat/ruleset.xml <(xmllint --format "./PHPCompatibilityParagonieSodiumCompat/ruleset.xml")

  test-random-compat:
    permissions:
      contents: read # To clone the repo.

    needs: xmllint

    strategy:
      # The latest version of Random Compat still has a minimum PHP version of PHP 5.2,
      # so we don't need to be concerned about testing different versions of Random compat
      # which would be served on different PHP versions.
      # Also: as this package is no longer in active development, we don't need to test against a "dev" version.
      matrix:
        php: ['5.4', 'latest']
        phpcompat: ['stable']

        include:
          - php: '7.4'
            phpcompat: 'dev-develop'

    continue-on-error: ${{ matrix.phpcompat != 'stable' }}

    name: "Random Compat: PHP ${{ matrix.php }} - PHPCompat ${{ matrix.phpcompat != 'stable' && 'dev' || 'stable' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
          coverage: none
        env:
          fail-fast: true

      # Remove all other polyfill requirements and just focus on the one package per run.
      - name: "Remove sodium compat polyfill package"
        run: composer remove --dev --no-update --no-scripts --no-interaction paragonie/sodium_compat

      - name: Conditionally update PHPCompatibility to develop version
        if: ${{ matrix.phpcompat != 'stable' }}
        run: |
          composer config minimum-stability dev
          composer require --no-update phpcompatibility/php-compatibility:"${{ matrix.phpcompat }}" --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Validate the composer.json file.
      # @link https://getcomposer.org/doc/03-cli.md#validate
      - name: Validate Composer installation
        run: composer validate --no-check-all --strict

      # Make sure that known polyfills don't trigger any errors.
      - name: Test the RandomCompat ruleset
        run: >
          vendor/bin/phpcs -ps ./Test/ParagonieRandomCompatTest.php --standard=PHPCompatibilityParagonieRandomCompat
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion 5.2-

      # Check that the ruleset doesn't throw unnecessary errors for code in the random compat library itself.
      - name: Test running against the RandomCompat polyfills
        # No need to run this on multiple PHP versions, but we do want to run it against PHPCompat stable + dev.
        if: ${{ matrix.php != '5.4' }}
        run: >
          vendor/bin/phpcs -ps ./vendor/paragonie/random_compat/ --standard=PHPCompatibilityParagonieRandomCompat
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --ignore=/random_compat/psalm-autoload.php,/random_compat/phpunit-autoload.php,/random_compat/tests/*,/random_compat/other/*
          --runtime-set testVersion 5.2-

  test-sodium-compat:
    permissions:
      contents: read # To clone the repo.

    needs: xmllint

    strategy:
      # Sodium Compat 1.x is compatible with PHP 5.3 - current.
      # Sodium Compat 2.x (master) is compatible with PHP 8.1 - current.
      matrix:
        php: ['5.4', '8.1', 'latest']
        phpcompat: ['stable']
        sodium: ['1', '2']

        exclude:
          - php: '8.1'
            phpcompat: 'stable'
            sodium: '1'
          - php: '5.4'
            phpcompat: 'stable'
            sodium: '2'

        include:
          - php: '7.4'
            phpcompat: 'dev-develop'
            sodium: '1'
          - php: '8.3'
            phpcompat: 'dev-develop'
            sodium: 'dev'

    continue-on-error: ${{ matrix.phpcompat != 'stable' }}

    name: "Sodium Compat ${{ matrix.sodium }}: PHP ${{ matrix.php }} - PHPCompat ${{ matrix.phpcompat != 'stable' && 'dev' || 'stable' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
          coverage: none
        env:
          fail-fast: true

      # Remove all other polyfill requirements and just focus on the one package per run.
      - name: "Remove random compat polyfill package"
        run: composer remove --dev --no-update --no-scripts --no-interaction paragonie/random_compat

      - name: Conditionally update PHPCompatibility to develop version
        if: ${{ matrix.phpcompat != 'stable' }}
        run: |
          composer config minimum-stability dev
          composer require --no-update phpcompatibility/php-compatibility:"${{ matrix.phpcompat }}" --no-interaction

      - name: Conditionally update Sodium Compat
        if: ${{ matrix.sodium != 'dev' }}
        run: composer require --dev --no-update paragonie/sodium_compat:"^${{ matrix.sodium }}.0" --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Make sure that known polyfills don't trigger any errors.
      - name: "Test the SodiumCompat ruleset"
        run: >
          vendor/bin/phpcs -ps ./Test/ParagonieSodiumCompatTest.php --standard=PHPCompatibilityParagonieSodiumCompat
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion ${{ matrix.sodium == '1' && '5.3-' || '8.1-' }}

      # Check that the ruleset doesn't throw unnecessary errors for code in the sodium compat library itself.
      - name: "Test running against the SodiumCompat polyfills"
        # No need to run this on multiple PHP versions, but we do want to run it against PHPCompat stable + dev.
        if: ${{ matrix.php != '5.4' && matrix.php != '8.1' }}
        run: >
          vendor/bin/phpcs -ps ./vendor/paragonie/sodium_compat/ --standard=PHPCompatibilityParagonieSodiumCompat
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --ignore=/sodium_compat/tests/*
          --runtime-set testVersion ${{ matrix.sodium == '1' && '5.3-' || '8.1-' }}
